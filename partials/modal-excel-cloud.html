<!-- MODAL ĐỒNG BỘ PHIÊN LÀM VIỆC TRỰC TUYẾN (PHÂN QUYỀN OTP & PIN) -->
<div class="modal fade" id="modalCloudSession" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white py-2">
                <h6 class="modal-title fw-bold">☁️ ĐỒNG BỘ & PHÂN QUYỀN PHIÊN LÀM VIỆC</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-3 bg-light">
                <div class="mb-2">
                    <label class="form-label small fw-bold mb-1">URL Web App Google Apps Script:</label>
                    <input type="url" id="cloud-gas-url" class="form-control form-control-sm" placeholder="https://script.google.com/macros/s/.../exec">
                </div>

                <ul class="nav nav-pills nav-fill bg-white p-1 rounded border mb-2 small fw-bold" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active py-1" id="tab-cloud-existing" data-bs-toggle="pill" data-bs-target="#pane-cloud-existing" type="button" role="tab">
                            1. Tải & Thao tác Phiên
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link py-1" id="tab-cloud-create" data-bs-toggle="pill" data-bs-target="#pane-cloud-create" type="button" role="tab">
                            2. Tạo Phiên Mới (Nhận OTP)
                        </button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="pane-cloud-existing" role="tabpanel">
                        <div class="row g-2 mb-2">
                            <div class="col-7">
                                <label class="form-label small fw-bold mb-1">Mã phiên (Tên JSON):</label>
                                <input type="text" id="cloud-session-id" class="form-control form-control-sm text-uppercase fw-bold" placeholder="VD: TNM-2026-06">
                            </div>
                            <div class="col-5">
                                <label class="form-label small fw-bold mb-1">Mã PIN (Bắt buộc):</label>
                                <input type="password" id="cloud-session-pin" class="form-control form-control-sm" placeholder="Nhập PIN">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold mb-1">Mã OTP Quản trị Hội đồng <span class="text-muted fw-normal">(Chỉ nhập nếu bạn là người xếp/khóa HĐ)</span>:</label>
                            <input type="text" id="cloud-session-otp" class="form-control form-control-sm font-monospace" placeholder="Để trống nếu chỉ vào nhập điểm">
                        </div>

                        <div class="d-flex flex-wrap gap-2 mt-2">
                            <button type="button" id="btn-cloud-load" class="btn btn-primary btn-sm fw-bold flex-grow-1">
                                ⬇️ Tải phiên từ Cloud
                            </button>
                            <button type="button" id="btn-cloud-save-hd" class="btn btn-success btn-sm fw-bold d-none">
                                💾 Lưu thay đổi HĐ
                            </button>
                            <button type="button" id="btn-cloud-toggle-lock" class="btn btn-warning btn-sm fw-bold d-none">
                                🔒 Chốt & Khóa HĐ
                            </button>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="pane-cloud-create" role="tabpanel">
                        <div class="row g-2 mb-2">
                            <div class="col-7">
                                <label class="form-label small fw-bold mb-1">Đặt Mã phiên (Tên JSON):</label>
                                <input type="text" id="create-session-id" class="form-control form-control-sm text-uppercase fw-bold" placeholder="VD: TNM-2026-06">
                            </div>
                            <div class="col-5">
                                <label class="form-label small fw-bold mb-1">Đặt Mã PIN nhập điểm:</label>
                                <input type="password" id="create-session-pin" class="form-control form-control-sm" placeholder="VD: 1234">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold mb-1">Email nhận thông tin phiên & Mã OTP sửa Hội đồng:</label>
                            <input type="email" id="create-session-email" class="form-control form-control-sm" placeholder="nhapemail@duytan.edu.vn">
                        </div>
                        <button type="button" id="btn-cloud-create" class="btn btn-success btn-sm fw-bold w-100 mt-1">
                            🚀 Khởi tạo Phiên & Gửi Mã OTP qua Email
                        </button>
                    </div>
                </div>

                <div id="cloud-sync-status" class="alert alert-secondary py-2 px-2 small mt-2 mb-0 d-none"></div>
            </div>
        </div>
    </div>
</div>
